# omamd palette — same keys as an Omarchy theme's colors.toml.
#
# This one is a light paper page with ink and a red accent, so it is
# obviously different from the built-in dark default (#1e1e2e).
#
#   omamd --html examples/welcome.md
#   omamd --theme examples/colors.toml --html examples/welcome.md
#
# Copy to ~/.config/omamd/colors.toml to make it the default off Omarchy.

mode = "light"

accent = "#c81e1e"
selection = "#f4c7a8"
muted = "#7d5c3e"

background = "#fff8ee"
dark_background = "#f3e6d4"
darker_background = "#e8d5b8"
lighter_background = "#ead9c2"

foreground = "#1a1008"
dark_foreground = "#7d5c3e"
light_foreground = "#1a1008"
bright_foreground = "#000000"

red = "#c81e1e"
yellow = "#b58100"
orange = "#d9480f"
green = "#2b6b3a"
cyan = "#0f6f7a"
blue = "#1d4e89"
magenta = "#8c1a6a"
brown = "#7c5716"
